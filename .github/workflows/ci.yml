name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: Bash syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          bash -n hf-model-download.sh
          bash -n hf-model-download-gui.sh

      - name: ShellCheck (informational)
        if: always()
        continue-on-error: true
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile GUI
        run: python -m py_compile hf-model-download-gui.py
