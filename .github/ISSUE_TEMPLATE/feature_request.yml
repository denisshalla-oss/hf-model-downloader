name: "✨ Feature request"
description: "An idea for a new feature or improvement"
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before filing, search existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: "What problem would this solve? What is painful today?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "How should it work? A command-line sketch or UI mock helps a lot."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Other ways you can imagine solving the same problem?"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Examples from other tools, links, screenshots, ..."
