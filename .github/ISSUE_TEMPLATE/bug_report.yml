name: "🐛 Bug report"
description: "Something is not working as expected"
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

  - type: input
    id: version
    attributes:
      label: Version
      description: "Which version are you using? (see the release page or `./hf-model-download.sh --help`)"
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface used
      options:
        - "CLI (hf-model-download.sh)"
        - "Web GUI (hf-model-download-gui.sh)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Other
    validations:
      required: true

  - type: dropdown
    id: gated
    attributes:
      label: Does this involve a private/gated repo or a token?
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Select ...
        3. What happens ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "What actually happened?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output / error message
      description: "Paste the relevant output. **Remove any tokens or private info first.**"
      render: shell

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: "Anything else that might help (repo URL, file sizes, .part state, ...)?"
